set-option -a terminal-overrides ",XXX:RGB"
set-option -a terminal-overrides ",*256col*:RGB"
set-option -a terminal-overrides ",alacritty:RGB"

set -g status-style 'bg=#333333 fg=#5eacd3'
bind r source-file ~/.tmux.conf
set -g base-index 1 #Starts tmux at 1 instead of 0

bind q kill-session
#to kill current pane prefix x
#to kill other panes except the current one prefix !

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R


#bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

bind-key -r M-j run-shell "tmux neww '~/.local/bin/tmux-sessionizer 0'"
bind-key -r M-k run-shell "tmux neww '~/.local/bin/tmux-sessionizer 1'"
bind-key -r M-l run-shell "tmux neww '~/.local/bin/tmux-sessionizer 2'"
bind-key -r M-t run-shell "tmux neww ~/.local/bin/tmux-sessionizer 3"

bind-key -r H run-shell "~/.local/bin/tmux-sessionizer ~/Documents/Honours/"
bind-key -r P run-shell "~/.local/bin/tmux-sessionizer ~/Documents/Projects/PVSraper/"
bind-key -r V run-shell "~/.local/bin/tmux-sessionizer ~/Documents/Photovoltaic/"
bind-key -r L run-shell "~/.local/bin/tmux-sessionizer ~/Documents/Linux-Dotfiles-2023/"
bind-key -r S run-shell "~/.local/bin/tmux-sessionizer ~/Documents/Source/"
bind-key -r D run-shell "~/.local/bin/tmux-sessionizer ~/Documents/"
